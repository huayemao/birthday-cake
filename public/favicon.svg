<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171b3a"/>
      <stop offset="100%" stop-color="#070b1a"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070b1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tierTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4ec"/>
    </linearGradient>
    <linearGradient id="tierBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="drip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Starry midnight squircle -->
  <rect data-bg="base" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect data-bg="aura" width="512" height="512" rx="116" fill="url(#aura)"/>

  <!-- Artwork group (scaled cleanly for maskable safe-zone exports) -->
  <g data-artwork="true">
    <!-- Ambient stars -->
    <circle cx="118" cy="134" r="5" fill="#fde68a" opacity="0.75"/>
    <circle cx="394" cy="144" r="6" fill="#f9a8d4" opacity="0.7"/>
    <circle cx="136" cy="212" r="3.5" fill="#ffffff" opacity="0.55"/>
    <circle cx="378" cy="222" r="4" fill="#fde68a" opacity="0.6"/>

    <!-- 3 Flames with smooth radial candlelight glow -->
    <circle cx="256" cy="126" r="78" fill="url(#flameGlow)"/>
    <path d="M198 108 C208 122 213 135 211 146 C209 155 204 161 198 161 C192 161 187 155 185 146 C183 135 188 122 198 108 Z" fill="url(#flame)"/>
    <path d="M256 88 C268 106 275 122 273 136 C271 147 264 154 256 154 C248 154 241 147 239 136 C237 122 244 106 256 88 Z" fill="url(#flame)"/>
    <path d="M314 108 C324 122 329 135 327 146 C325 155 320 161 314 161 C308 161 303 155 301 146 C299 135 304 122 314 108 Z" fill="url(#flame)"/>

    <!-- 3 Candles -->
    <rect x="189" y="166" width="18" height="48" rx="7" fill="#fbcfe8"/>
    <rect x="246" y="159" width="20" height="55" rx="8" fill="#ffffff"/>
    <rect x="305" y="166" width="18" height="48" rx="7" fill="#fde68a"/>

    <!-- Upper tier (white cream + pink drips) -->
    <rect x="158" y="210" width="196" height="92" rx="24" fill="url(#tierTop)"/>
    <path d="M180 210 H332 C345 210 354 220 354 233 V245 C354 253 347 259 339 259 C330 259 326 248 316 248 C306 248 302 266 290 266 C278 266 274 247 262 247 C250 247 246 262 234 262 C222 262 218 248 206 248 C194 248 190 262 178 262 C167 262 158 255 158 244 V233 C158 220 167 210 180 210 Z" fill="url(#drip)"/>

    <!-- Lower tier (signature pastel rose) -->
    <rect x="108" y="296" width="296" height="104" rx="28" fill="url(#tierBot)"/>

    <!-- Pearl dots along lower base -->
    <circle cx="144" cy="382" r="7" fill="#fff1f2"/>
    <circle cx="182" cy="382" r="7" fill="#fbcfe8"/>
    <circle cx="220" cy="382" r="7" fill="#fff1f2"/>
    <circle cx="256" cy="382" r="7" fill="#fbcfe8"/>
    <circle cx="292" cy="382" r="7" fill="#fff1f2"/>
    <circle cx="330" cy="382" r="7" fill="#fbcfe8"/>
    <circle cx="368" cy="382" r="7" fill="#fff1f2"/>

    <!-- Golden plate -->
    <rect x="90" y="396" width="332" height="20" rx="10" fill="url(#gold)"/>
  </g>
</svg>
